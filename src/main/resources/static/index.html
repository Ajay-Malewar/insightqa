<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>InsightQA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .subtitle { color: #666; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; margin-top: 0; }
  input, button {
    font-size: 0.95rem;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-right: 8px;
    margin-bottom: 8px;
  }
  input[type=text], input[type=password] { width: 200px; }
  button {
    background: #111;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #333; }
  button:disabled { background: #999; cursor: not-allowed; }
  button.danger { background: #b00020; }
  button.danger:hover { background: #8c0019; }
  button.secondary { background: #888; }
  button.secondary:hover { background: #666; }
  #status { font-size: 0.85rem; color: #666; margin-top: 8px; min-height: 18px; }
  .chat-log { max-height: 400px; overflow-y: auto; margin-bottom: 12px; }
  .msg { margin-bottom: 16px; }
  .msg .q { font-weight: 600; margin-bottom: 4px; }
  .msg .a { background: #f0f0f0; padding: 10px; border-radius: 8px; }
  .sources { margin-top: 8px; font-size: 0.8rem; color: #555; }
  .source-item { background: #fafafa; border-left: 3px solid #111; padding: 6px 10px; margin-top: 4px; }
  .hidden { display: none; }
  .token-badge {
    display: inline-block;
    background: #e8f5e9;
    color: #2e7d32;
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 0.8rem;
  }
  .doc-list { margin-top: 12px; }
  .doc-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: #fafafa;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 0.9rem;
  }
  .doc-item .doc-name { font-weight: 500; }
  .doc-item .doc-meta { color: #777; font-size: 0.8rem; margin-left: 8px; }
  .doc-item button { margin: 0; padding: 4px 10px; font-size: 0.8rem; }
  .empty-state { color: #999; font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>

<h1>InsightQA</h1>
<div class="subtitle">AI-powered document Q&A with source citations, built on Spring Boot + Spring AI</div>

<div class="card" id="authCard">
  <h2>1. Log in or register</h2>
  <input type="text" id="username" placeholder="username" value="demo">
  <input type="password" id="password" placeholder="password" value="demopass123">
  <br>
  <button onclick="register()">Register</button>
  <button onclick="login()">Log in</button>
  <div id="status"></div>
</div>

<div class="card hidden" id="uploadCard">
  <h2>2. Your documents <span class="token-badge" id="authBadge"></span></h2>
  <input type="file" id="fileInput" accept=".txt,.pdf">
  <button onclick="uploadDocument()">Upload</button>
  <div id="uploadStatus"></div>

  <div class="doc-list" id="docList"></div>
</div>

<div class="card hidden" id="qaCard">
  <h2>3. Ask questions</h2>
  <div class="chat-log" id="chatLog"></div>
  <input type="text" id="questionInput" placeholder="Ask a question about your document..." style="width: 100%; margin-bottom: 8px;">
  <br>
  <button onclick="askQuestion()">Ask</button>
  <button class="secondary" onclick="resetConversation()">New conversation</button>
</div>

<script>
  const baseUrl = window.location.origin;
  let token = null;
  let refreshToken = null;
  let conversationId = "conv-" + Math.random().toString(36).substring(2, 10);

  async function register() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const status = document.getElementById("status");
    try {
      const res = await fetch(`${baseUrl}/api/auth/register`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const text = await res.text();
      status.textContent = text;
    } catch (e) {
      status.textContent = "Error: " + e.message;
    }
  }

  async function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const status = document.getElementById("status");
    try {
      const res = await fetch(`${baseUrl}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) {
        status.textContent = "Login failed (check credentials or register first)";
        return;
      }
      const data = await res.json();
      token = data.accessToken;
      refreshToken = data.refreshToken;
      status.textContent = "Logged in successfully.";
      document.getElementById("authBadge").textContent = "Authenticated as " + username;
      document.getElementById("uploadCard").classList.remove("hidden");
      document.getElementById("qaCard").classList.remove("hidden");
      await refreshDocumentList();
    } catch (e) {
      status.textContent = "Error: " + e.message;
    }
  }

  async function uploadDocument() {
    const fileInput = document.getElementById("fileInput");
    const uploadStatus = document.getElementById("uploadStatus");
    if (!fileInput.files.length) {
      uploadStatus.textContent = "Choose a file first.";
      return;
    }
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);

    uploadStatus.textContent = "Uploading and indexing...";
    try {
      const res = await fetch(`${baseUrl}/api/documents/upload`, {
        method: "POST",
        headers: { "Authorization": "Bearer " + token },
        body: formData
      });
      const text = await res.text();
      uploadStatus.textContent = text;
      fileInput.value = "";
      await refreshDocumentList();
    } catch (e) {
      uploadStatus.textContent = "Error: " + e.message;
    }
  }

  async function refreshDocumentList() {
    const docList = document.getElementById("docList");
    docList.innerHTML = "Loading documents...";
    try {
      const res = await fetch(`${baseUrl}/api/documents`, {
        headers: { "Authorization": "Bearer " + token }
      });
      if (!res.ok) {
        docList.innerHTML = '<div class="empty-state">Could not load documents.</div>';
        return;
      }
      const docs = await res.json();
      if (!docs.length) {
        docList.innerHTML = '<div class="empty-state">No documents uploaded yet.</div>';
        return;
      }
      docList.innerHTML = docs.map(d => `
        <div class="doc-item">
          <span><span class="doc-name">${escapeHtml(d.fileName)}</span><span class="doc-meta">${d.chunkCount} chunk${d.chunkCount === 1 ? '' : 's'}</span></span>
          <button class="danger" onclick="deleteDocument('${escapeJs(d.fileName)}')">Delete</button>
        </div>
      `).join("");
    } catch (e) {
      docList.innerHTML = '<div class="empty-state">Error loading documents: ' + escapeHtml(e.message) + '</div>';
    }
  }

  async function deleteDocument(fileName) {
    if (!confirm(`Delete "${fileName}"? This removes it from your document index.`)) return;
    const uploadStatus = document.getElementById("uploadStatus");
    try {
      const res = await fetch(`${baseUrl}/api/documents/${encodeURIComponent(fileName)}`, {
        method: "DELETE",
        headers: { "Authorization": "Bearer " + token }
      });
      const text = await res.text();
      uploadStatus.textContent = text;
      await refreshDocumentList();
    } catch (e) {
      uploadStatus.textContent = "Error: " + e.message;
    }
  }

  async function askQuestion() {
    const input = document.getElementById("questionInput");
    const question = input.value.trim();
    if (!question) return;
    input.value = "";

    const chatLog = document.getElementById("chatLog");
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg";
    msgDiv.innerHTML = `<div class="q">You: ${escapeHtml(question)}</div><div class="a">Thinking...</div>`;
    chatLog.appendChild(msgDiv);
    chatLog.scrollTop = chatLog.scrollHeight;

    try {
      const url = `${baseUrl}/api/qa?question=${encodeURIComponent(question)}&conversationId=${encodeURIComponent(conversationId)}`;
      const res = await fetch(url, {
        headers: { "Authorization": "Bearer " + token }
      });
      if (!res.ok) {
        msgDiv.querySelector(".a").textContent = "Error: " + res.status + " " + res.statusText;
        return;
      }
      const data = await res.json();
      let sourcesHtml = "";
      if (data.sources && data.sources.length) {
        sourcesHtml = '<div class="sources"><strong>Sources:</strong>' +
          data.sources.map(s => `<div class="source-item">${escapeHtml(s.fileName)}: "${escapeHtml(s.snippet)}"</div>`).join("") +
          "</div>";
      }
      msgDiv.querySelector(".a").innerHTML = escapeHtml(data.answer) + sourcesHtml;
      chatLog.scrollTop = chatLog.scrollHeight;
    } catch (e) {
      msgDiv.querySelector(".a").textContent = "Error: " + e.message;
    }
  }

  function resetConversation() {
    conversationId = "conv-" + Math.random().toString(36).substring(2, 10);
    document.getElementById("chatLog").innerHTML = "";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function escapeJs(str) {
    return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
  }

  document.getElementById("questionInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") askQuestion();
  });
</script>

</body>
</html>
